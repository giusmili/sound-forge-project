name: Desktop Windows Build

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "recovery/**"
      - "fix/**"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S desktop -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: |
          $env:_CL_ = "/MP2"
          cmake --build build --config Release --parallel 1

      - name: Test MIDI stability and audio
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepare test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "build/SonoForge_artefacts/Release/SonoForge Studio.exe" "package/SonoForge Studio.exe"
          Copy-Item "desktop/TESTING.md" "package/TESTING.md"
          @"
          SonoForge Studio 0.9.1
          Commit: $env:GITHUB_SHA
          Platform: Windows x64
          Build: Release
          "@ | Set-Content -Encoding UTF8 "package/BUILD_INFO.txt"
          Compress-Archive -Path "package/*" -DestinationPath "SonoForge-Studio-Windows-0.9.1.zip" -Force

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SonoForge-Windows-Executable
          path: "build/SonoForge_artefacts/Release/SonoForge Studio.exe"
          if-no-files-found: error

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: SonoForge-Studio-Windows-0.9.1
          path: "SonoForge-Studio-Windows-0.9.1.zip"
          if-no-files-found: error
