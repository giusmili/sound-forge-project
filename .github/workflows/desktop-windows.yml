name: Desktop Windows Build

on:
  push:
    branches:
      - develop
      - "feature/**"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S desktop -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SonoForge-Windows
          path: build/SonoForge_artefacts/Release/SonoForge.exe
          if-no-files-found: error
