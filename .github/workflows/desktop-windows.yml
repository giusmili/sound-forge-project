name: Desktop Windows Build

on:
  push:
    branches:
      - develop
      - "feature/**"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S desktop -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Prepare Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "build/SonoForge_artefacts/Release/SonoForge Studio.exe" "package/SonoForge Studio.exe"
          @"
          SonoForge Studio - Windows diagnostic build

          This build creates its writable user files on first launch in:
          %APPDATA%\SonoForge

          Configuration:
          %APPDATA%\SonoForge\config\settings.json

          Diagnostic log:
          %APPDATA%\SonoForge\logs\sonoforge.log

          If the application closes during audio import, keep sonoforge.log.
          It records the last completed import and audio-engine step.
          "@ | Set-Content -Encoding UTF8 "package/README-DIAGNOSTIC.txt"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SonoForge-Windows
          path: package/**
          if-no-files-found: error
